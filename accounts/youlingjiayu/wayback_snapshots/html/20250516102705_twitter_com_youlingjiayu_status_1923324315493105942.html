  想起朋友带我去拍卖设的群，说我可以去卖文设；然后我一天手搓了三篇研究出这帮人喜欢什么样的文风和设定，在那个圈子里待了一阵子顺便卖了点屁股……最后写不了解的人设的黄文写到吐。
  <br/>
  总地来说不是很难，但本质上还是很无聊；同人圈也很无聊，讨好读者完全没有挑战性，最后只有我自己对自己不满意。
