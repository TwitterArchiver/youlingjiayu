  我突然想起一位旅者，姑且这么称呼这位故人吧。
  <br/>
  他突发奇想带上我去旅行，没有任何预兆地，在他随心所欲的，独自的冒险里捎上了我。
  <br/>
  分别前我问他：“为什么是我？”据我所知他几乎一直都是一个人旅行。
  <br/>
  “因为我觉得，这小孩挺怪的。”我不记得他眼睛亮不亮了，因为我不敢看他，但是应该是笑着的。
