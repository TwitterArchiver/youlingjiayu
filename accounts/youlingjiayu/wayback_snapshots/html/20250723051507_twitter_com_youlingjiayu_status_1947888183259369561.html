  感觉极大影响我学习一些知识的东西是翻译，一个英文学术用词有好几个中文翻译名词。

  而且仅仅望文生义的意思也不准确，还需要再消耗时间和经历辨析不同情境下的同一个词的具体含义（然后发现在英文里的表述是两个完全不同的词）。
  <br/>
  我很想用英文直接学但这样就没法应试了。
